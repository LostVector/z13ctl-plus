version: 2

project_name: z13ctl-plus

before:
  hooks:
    - go mod tidy

builds:
  - id: z13ctl
    binary: z13ctl
    ldflags:
      - -s -w -X github.com/dahui/z13ctl/cmd.Version={{.Version}}
    goos:
      - linux
    goarch:
      - amd64

archives:
  - id: z13ctl
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - contrib/systemd/**/*
      - contrib/udev/*

checksum:
  name_template: "checksums.txt"

nfpms:
  - id: z13ctl-pkg
    package_name: z13ctl-plus
    section: utils
    formats:
      - archlinux
      - deb
      - rpm
    homepage: https://github.com/aic0d3r/z13ctl-plus
    maintainer: "aic0d3r <funforfreeapps@gmail.com>"
    description: z13ctl-plus CLI and daemon for ASUS ROG Flow Z13 hardware control
    license: Apache-2.0
    dependencies:
      - systemd
      - dbus
    provides:
      - z13ctl
    conflicts:
      - z13ctl
    replaces:
      - z13ctl
    scripts:
      postinstall: contrib/nfpm/postinstall.sh
      preremove: contrib/nfpm/preremove.sh
      postremove: contrib/nfpm/postremove.sh
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/z13ctl-plus/LICENSE
      - src: contrib/systemd/user/z13ctl.socket
        dst: /usr/lib/systemd/user/z13ctl.socket
      - src: contrib/systemd/user/z13ctl.service
        dst: /usr/lib/systemd/user/z13ctl.service
      - src: contrib/systemd/system/z13ctl-perms.service
        dst: /usr/lib/systemd/system/z13ctl-perms.service
      - src: contrib/udev/99-z13ctl.rules
        dst: /usr/lib/udev/rules.d/99-z13ctl.rules
    archlinux:
      packager: "aic0d3r <funforfreeapps@gmail.com>"
    overrides:
      archlinux:
        suggests:
          - "ryzen_smu-dkms-git: CPU undervolting via Curve Optimizer"
    rpm:
      group: Applications/System

release:
  github:
    owner: aic0d3r
    name: z13ctl-plus
  draft: false
  prerelease: auto
  # The annotated tag's message body becomes the top of the release notes,
  # followed by the auto-generated commit changelog. Write detailed notes with
  # `git tag -a vX.Y.Z` (opens an editor) or `git tag -a vX.Y.Z -F notes.md`.
  # Lightweight tags (no -a/-m) leave this empty and fall back to the changelog.
  header: |
    {{ .TagBody }}

    ---

    **z13ctl-plus** is a compatibility-preserving distribution of
    [dahui/z13ctl](https://github.com/dahui/z13ctl). The installed command and
    runtime interfaces remain `z13ctl`.
