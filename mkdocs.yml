site_name: z13ctl-plus
site_url: https://aic0d3r.github.io/z13ctl-plus
site_description: Independently named dahui/z13ctl-compatible fork with power automation, composable tuning, coordinated display state, and expanded telemetry.

repo_url: https://github.com/aic0d3r/z13ctl-plus
repo_name: aic0d3r/z13ctl-plus
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - tables

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Quick Start: getting-started.md
  - Reference:
    - Commands: commands.md
    - Daemon: daemon.md
    - API: api.md
  - Protocol: protocol.md
  - Contributing: contributing.md
